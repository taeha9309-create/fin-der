name: fin-der

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    logging: *default-logging

  db-api:
    build:
      context: ./db-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - database
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT}
    ports:
      - "${DB_API_PORT}:8081"
    logging: *default-logging

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      ANALYSIS_STORAGE_DIR: /data/analyses
      ANALYSIS_RETENTION_HOURS: ${ANALYSIS_RETENTION_HOURS:-24}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
    volumes:
      - analysis_data:/data/analyses
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 512mb
    init: true
    restart: unless-stopped
    logging: *default-logging

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  page-ai-mock:
    build:
      context: ./page-ai-mock
      dockerfile: Dockerfile
    environment:
      PORT: 8002
      ENABLE_TEST_FAILURES: "true"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    logging: *default-logging

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  url-ai-mock:
    build:
      context: ./url-ai-mock
      dockerfile: Dockerfile
    environment:
      PORT: 8001
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    logging: *default-logging

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SANDBOX_BASE_URL: http://sandbox:3001
      ANALYSIS_ARTIFACT_STORAGE_DIR: /data/analyses
      PAGE_ANALYSIS_BASE_URL: http://page-ai-mock:8002
      URL_ANALYSIS_BASE_URL: http://url-ai-mock:8001
      ANALYSIS_JOB_STORAGE_DIR: /data/jobs
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-2}
      MAX_QUEUED_ANALYSES: ${MAX_QUEUED_ANALYSES:-20}
      SANDBOX_RETRY_COUNT: ${SANDBOX_RETRY_COUNT:-1}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-90}
      ANALYSIS_JOB_RETENTION_HOURS: ${ANALYSIS_JOB_RETENTION_HOURS:-24}
      ANALYSIS_JOB_CLEANUP_INTERVAL_MS: ${ANALYSIS_JOB_CLEANUP_INTERVAL_MS:-3600000}
    volumes:
      - analysis_job_data:/data/jobs
      - analysis_data:/data/analyses:ro
    depends_on:
      sandbox:
        condition: service_healthy
      page-ai-mock:
        condition: service_healthy
      url-ai-mock:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: unless-stopped
    logging: *default-logging

volumes:
  database_data:
  analysis_data:
  analysis_job_data:
