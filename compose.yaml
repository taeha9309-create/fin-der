name: fin-der

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-3}"

services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-change-root-password}
      MYSQL_DATABASE: ${DATABASE_NAME:-finder}
      MYSQL_USER: ${DATABASE_USER:-finder}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    ports:
      - "${DATABASE_HOST_PORT:-3307}:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  db-api:
    build:
      context: ./db-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-finder}
      DATABASE_USER: ${DATABASE_USER:-finder}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
    ports:
      - "${DB_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    logging: *default-logging

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/artifacts/url_xgb.joblib
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8001/health')); assert data['model_loaded']"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      ANALYSIS_STORAGE_DIR: /data/analyses
      ANALYSIS_RETENTION_HOURS: ${ANALYSIS_RETENTION_HOURS:-24}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
      SANDBOX_TEST_ALLOW_HOST: ${SANDBOX_TEST_ALLOW_HOST:-}
    ports:
      - "${SANDBOX_SERVICE_PORT:-8003}:3001"
    volumes:
      - analysis_data:/data/analyses
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 512mb
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging

  multimodal-service:
    build:
      context: ./multimodal-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
      MAX_SCREENSHOT_BYTES: 10485760
      MAX_HTML_BYTES: 2097152
    ports:
      - "${MULTIMODAL_SERVICE_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *default-logging

  page-ai-mock:
    build:
      context: ./page-ai-mock
      dockerfile: Dockerfile
    environment:
      PORT: 8002
      ENABLE_TEST_FAILURES: "true"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  url-ai-mock:
    build:
      context: ./url-ai-mock
      dockerfile: Dockerfile
    environment:
      PORT: 8001
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SANDBOX_BASE_URL: http://sandbox:3001
      ML_SERVICE_BASE_URL: http://ml-service:8001
      MULTIMODAL_SERVICE_BASE_URL: http://multimodal-service:8002
      DB_API_BASE_URL: http://db-api:8081
      ANALYSIS_ARTIFACT_STORAGE_DIR: /data/analyses
      PAGE_ANALYSIS_BASE_URL: http://multimodal-service:8002
      URL_ANALYSIS_BASE_URL: http://url-ai-mock:8001
      ANALYSIS_JOB_STORAGE_DIR: /data/jobs
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-2}
      MAX_QUEUED_ANALYSES: ${MAX_QUEUED_ANALYSES:-20}
      SANDBOX_RETRY_COUNT: ${SANDBOX_RETRY_COUNT:-1}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-90}
      ANALYSIS_JOB_RETENTION_HOURS: ${ANALYSIS_JOB_RETENTION_HOURS:-24}
      ANALYSIS_JOB_CLEANUP_INTERVAL_MS: ${ANALYSIS_JOB_CLEANUP_INTERVAL_MS:-3600000}
    volumes:
      - analysis_job_data:/data/jobs
      - analysis_data:/data/analyses:ro
    depends_on:
      db-api:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      multimodal-service:
        condition: service_healthy
      page-ai-mock:
        condition: service_healthy
      url-ai-mock:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
      db-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *default-logging

volumes:
  database_data:
  analysis_data:
  analysis_job_data:
