name: fin-der

services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  db-api:
    build:
      context: ./db-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - database
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT}
    ports:
      - "${DB_API_PORT}:8081"

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      ANALYSIS_STORAGE_DIR: /data/analyses
      ANALYSIS_RETENTION_HOURS: ${ANALYSIS_RETENTION_HOURS:-24}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
    volumes:
      - analysis_data:/data/analyses
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 512mb
    init: true
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SANDBOX_BASE_URL: http://sandbox:3001
      ANALYSIS_JOB_STORAGE_DIR: /data/jobs
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-2}
      MAX_QUEUED_ANALYSES: ${MAX_QUEUED_ANALYSES:-20}
      SANDBOX_RETRY_COUNT: ${SANDBOX_RETRY_COUNT:-1}
    volumes:
      - analysis_job_data:/data/jobs
    depends_on:
      - sandbox
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    init: true
    restart: unless-stopped

volumes:
  database_data:
  analysis_data:
  analysis_job_data:
